# Local environment: PostgreSQL, LocalStack (SQS), Keycloak (OIDC IdP) and three
# independent instances of the service (each with its own process, connections
# and memory) that share nothing but the database and the queues.
#
#   docker compose up --build        # everything
#   docker compose up -d postgres localstack keycloak   # only test dependencies

x-service-env: &service-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_ENDPOINT_URL: http://localstack:4566
  SQS_INPUT_QUEUE: ${SQS_INPUT_QUEUE:-wager-transactions.fifo}
  SQS_INPUT_DLQ: ${SQS_INPUT_DLQ:-wager-transactions-dlq.fifo}
  SQS_EVENTS_QUEUE: ${SQS_EVENTS_QUEUE:-wager-events.fifo}
  SQS_VISIBILITY_TIMEOUT: ${SQS_VISIBILITY_TIMEOUT:-60s}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
  # The issuer is the public realm URL (what token requesters see); the signing
  # keys are fetched over the Compose network.
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/wagering}
  OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wagering-api}
  OIDC_ROLE_PROVIDER: ${OIDC_ROLE_PROVIDER:-wagering-provider}
  OIDC_ROLE_INTERNAL: ${OIDC_ROLE_INTERNAL:-wagering-internal}
  OIDC_PROVIDER_CLAIM: ${OIDC_PROVIDER_CLAIM:-provider_id}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9100"

# The image is built once, by `bootstrap` (compose builds services that share an
# image name in parallel and would race); the instances just run it.
x-api: &api
  image: wagering:local
  depends_on:
    bootstrap:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
  environment:
    <<: *service-env
  restart: unless-stopped
  stop_grace_period: 30s   # > SHUTDOWN_TIMEOUT (25s): SIGTERM drains before SIGKILL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed public URL => stable `iss`; back-channel endpoints (JWKS) stay
      # reachable through whatever host the caller used (keycloak:8080 in Compose).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/wagering/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q '200'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # One-shot: applies the migrations and provisions the SQS queues (DLQ and
  # redrive policy included). Idempotent, safe to re-run.
  bootstrap:
    build: .
    image: wagering:local
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      <<: *service-env
    entrypoint: ["/bin/sh", "-c"]
    command: ["wagering migrate up && wagering queues init"]
    restart: "no"

  api-1:
    <<: *api
    environment:
      <<: *service-env
      INSTANCE_ID: api-1
    ports:
      - "8081:8080"
      - "9101:9100"

  api-2:
    <<: *api
    environment:
      <<: *service-env
      INSTANCE_ID: api-2
    ports:
      - "8082:8080"
      - "9102:9100"

  api-3:
    <<: *api
    environment:
      <<: *service-env
      INSTANCE_ID: api-3
    ports:
      - "8083:8080"
      - "9103:9100"

  # Runs the whole test suite (unit + integration, with the race detector)
  # inside the Compose network against the real PostgreSQL, Keycloak and
  # LocalStack:   docker compose --profile tests run --rm tests
  tests:
    profiles: ["tests"]
    image: golang:1.26
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TEST_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/postgres?sslmode=disable
      TEST_AWS_ENDPOINT_URL: http://localstack:4566
      TEST_KEYCLOAK_URL: http://keycloak:8080
      TEST_OIDC_ISSUER: http://localhost:8080/realms/wagering
      CGO_ENABLED: "1"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    command: ["go", "test", "-race", "-count=1", "-tags", "integration", "./..."]

volumes:
  pgdata:
  gomod:
  gobuild:
